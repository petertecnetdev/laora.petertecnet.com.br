name: Deploy VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    # Central deploy: SSH retries, serialized VPS builds and superseded-run cancellation.
    # Recovery redeploy after the shared VPS incident.
    uses: petertecnetdev/petertecnet.com.br/.github/workflows/reusable-vps-deploy.yml@main
    with:
      deploy_path: /var/www/laora.petertecnet.com.br
      deploy_type: frontend
      deploy_branch: main
      health_url: https://laora.petertecnet.com.br/
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

  verify-release:
    name: Verify deployed release SHA
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm production serves this commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_SHA_URL: https://laora.petertecnet.com.br/release-sha.txt
        run: |
          set -euo pipefail
          cache_bust="$(date +%s%N)"
          actual_sha="$(curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 3 --max-time 20 \
            --header 'Cache-Control: no-cache, no-store, max-age=0' \
            --header 'Pragma: no-cache' \
            "${RELEASE_SHA_URL}?verify=${cache_bust}" | tr -d '\r\n')"
          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "Production release mismatch: expected $EXPECTED_SHA, got ${actual_sha:-<empty>}." >&2
            exit 42
          fi
          echo "Production release verified: $actual_sha"
