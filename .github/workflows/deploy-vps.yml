name: Deploy VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run validate

  deploy:
    needs: validate
    # Central deploy: SSH retries, serialized VPS builds and superseded-run cancellation.
    # Recovery redeploy after the shared VPS incident.
    uses: petertecnetdev/petertecnet.com.br/.github/workflows/reusable-vps-deploy.yml@main
    with:
      deploy_path: /var/www/laora.petertecnet.com.br
      deploy_type: frontend
      deploy_branch: main
      health_url: https://laora.petertecnet.com.br/
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

  verify-release:
    name: Verify deployed release SHA
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH fallback
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Confirm production serves this commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_SHA_URL: https://laora.petertecnet.com.br/release-sha.txt
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          cache_bust="$(date +%s%N)"

          # Prefer an external read because it proves the public release. A hosted
          # runner can occasionally be unable to reach the VPS even though the
          # deploy job's public health check succeeded, so transport failure alone
          # must not turn a healthy release red.
          if actual_sha="$(curl --fail --silent --show-error --location --retry 2 --retry-all-errors --retry-delay 2 --connect-timeout 8 --max-time 15 \
            --header 'Cache-Control: no-cache, no-store, max-age=0' \
            --header 'Pragma: no-cache' \
            "${RELEASE_SHA_URL}?verify=${cache_bust}" | tr -d '\r\n')"; then
            verification_source="public HTTPS"
          else
            echo "Public release probe could not reach production; verifying the deployed artifact over SSH." >&2
            actual_sha="$(ssh -i ~/.ssh/id_ed25519 -p "${VPS_PORT:-22}" \
              -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
              "${VPS_USER}@${VPS_HOST}" \
              'tr -d "\\r\\n" < /var/www/laora.petertecnet.com.br/release-sha.txt')"
            verification_source="SSH fallback after successful deploy health check"
          fi

          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "Production release mismatch: expected $EXPECTED_SHA, got ${actual_sha:-<empty>} ($verification_source)." >&2
            exit 42
          fi
          echo "Production release verified via $verification_source: $actual_sha"
