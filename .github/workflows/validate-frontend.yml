name: Validate Laora frontend

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/ecosystem-visual-analytics]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
